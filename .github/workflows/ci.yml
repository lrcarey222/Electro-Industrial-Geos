name: Electro-Industrial-ci

on:
  push:
  pull_request:

jobs:
  pipeline-check:
    runs-on: ubuntu-latest
    env:
      Electro-Industrial_USE_SAMPLE_DATA: "true"
      SKIP_DATA_DOWNLOADS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      # Runs before dependency installation on purpose: parse() is base R, so a
      # syntax error is reported in seconds rather than after a package build.
      - name: Syntax check
        run: Rscript scripts/check_syntax.R
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::renv, any::testthat, any::lintr
      # Needs only `yaml`, so it runs before the data steps: fails the build if
      # any indicator in index_definition.yml is claimed by no source, or by
      # more than one, so a new indicator cannot enter the index with no
      # provenance and no owner.
      - name: Validate source registry
        run: Rscript scripts/01_validate_sources.R
      # Informational only. A stale source is a fact to be surfaced and owned,
      # not a reason to fail someone's unrelated code change, so exit codes 1
      # (warn/pending) and 2 (fail) are reported and tolerated here. The
      # scheduled data-freshness workflow is what acts on them. Anything above 2
      # is a crash and does fail the build.
      - name: Data status report
        shell: bash
        run: |
          set +e
          Rscript scripts/02_check_freshness.R --no-write
          code=$?
          set -e
          echo "freshness exit code: $code"
          if [ "$code" -gt 2 ]; then
            echo "::error::freshness check crashed (exit $code)"
            exit "$code"
          fi
      # The `Restore renv` step was removed here. renv.lock is a hand-written
      # stub whose 18 entries carry only Package and Version -- no Source,
      # Repository or Hash -- so renv::restore() aborts in
      # renv_record_source_normalize() with "argument is of length zero". It has
      # never worked, and renv/activate.R is a no-op, so the project has renv's
      # shape without its behaviour. Dependencies are resolved from DESCRIPTION
      # by setup-r-dependencies above, which is what has actually been doing the
      # work. Reproducible pinning is real outstanding work that needs a genuine
      # renv::init()/snapshot() -- see docs/refactor_plan.md F-19 and 3.5.
      # Keeping a step that only pretends to pin versions is worse than not
      # having one.
      # The repository is public, so raw data that is not itself public must not
      # be reachable through it. Any tracked file that .gitignore also excludes
      # means someone re-added a licensed payload, most likely with `git add -f`.
      - name: No licensed data tracked
        shell: bash
        run: |
          set -euo pipefail
          tracked_but_ignored=$(git ls-files -i -c --exclude-standard)
          if [ -n "$tracked_but_ignored" ]; then
            echo "::error::tracked files are excluded by .gitignore -- a licensed payload may have been committed"
            echo "$tracked_but_ignored"
            echo
            echo "See docs/refactor_plan.md F-13. Untrack with:"
            echo "  git rm --cached <path>"
            exit 1
          fi
          echo "no tracked file is gitignored"
      - name: Secret scan
        run: |
          if git grep -nE "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|ghp_[0-9A-Za-z]{36}|password\s*=|secret\s*=|token\s*=)" -- .; then
            echo "Potential secret detected. Remove secrets before committing."
            exit 1
          fi
      - name: Unit tests
        run: Rscript -e "testthat::test_dir('tests/testthat')"
      - name: Smoke test
        run: Rscript run_pipeline.R
