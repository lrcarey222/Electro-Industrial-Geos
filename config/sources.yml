    auth_env: null
    geography: state
    cadence: monthly
    typical_release_lag_days: 75
    refresh_cron: "0 9 5 * *"
    staleness:
      warn_after_days: 60
      fail_after_days: 120
    steward: jonekberg
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      Stable URL, no key. Sheet 1 repeats a four-column block per customer
      class; the INDUSTRIAL price is the third Cents/kWh block (spreadsheet
      column P), not the first. See docs/refactor_plan.md F-04 -- the current
      code reads the residential column.

