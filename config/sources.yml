    refresh_cron: null
    staleness:
      warn_after_days: 730
      fail_after_days: 1095
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      416 PEAs. Geography only. Committed under
      data/raw/FCC_PEAs_Website/. A second orphan copy of the .shp exists at
      data/raw/FCC_PEAs_website.shp with no sidecar files and no reader.

  - id: fcc_pea_county_crosswalk
    label: "FCC PEA-to-county crosswalk"
