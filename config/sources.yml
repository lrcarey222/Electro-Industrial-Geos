  # -- Origin not determinable from this repository ------------------------
  # Each of these feeds a live indicator. They stay `unknown` -- and therefore
  # manual -- until a human states what the source is. An honest unknown with
  # an owner and a deadline beats a wrong automated guess.

  - id: spot_gap_analysis
    label: "SPOT policy score (50 State Gap Analysis workbook)"
    feeds: [spot_score]
    publisher: "SPOT for Clean Energy (State Policy Opportunity Tracker)"
    access_class: manual
    endpoint: "https://www.spotforcleanenergy.org/"
    auth_env: null
    geography: state
    cadence: irregular
    typical_release_lag_days: null
    refresh_cron: null
    staleness:
      warn_after_days: 550
      fail_after_days: 730
    steward: lrcarey222
    # Retained by decision of 2026-09-18: the use restriction below is known and
    # the risk is accepted. Not blocked -- but do not remove the restriction from
    # the notes, because anyone publishing or citing spot_score should be able to
    # find it.
    can_commit_raw: false
    license: "TODO-CONFIRM -- underlying facts are stated to be public domain, but see the use restriction in notes"
    manual_instructions: >
      Source identified 2026-09-16 as spotforcleanenergy.org. The committed
      artifact is "50 State Gap Analysis.xlsx", one worksheet per state of
      Yes/No/Partial answers, averaged per state into spot_score.

      To refresh: obtain a current export in the same shape -- one sheet per
      state, question in column 1 and answer in column 2, answers being Yes / No
      / Partial. The pipeline maps Yes to 1, No to 0, anything matching
      "partial" or "some" to 0.5, and averages per state.

      Read the use restriction in the notes before refreshing. It does not block
      the refresh, but it constrains how the result may be presented.
    template: data/manual/spot_gap_analysis/TEMPLATE.csv
    column_contract:
      spot: [state, spot_score]
    notes: >
      *** USE RESTRICTION -- ACKNOWLEDGED AND ACCEPTED 2026-09-18 ***

      Decision: spot_score stays in policy_intent as it is. The conflict below
      is recorded rather than resolved, so it is visible to anyone who publishes
      or cites this indicator.

      The SPOT landing page states, unprompted: "This website, and the data
      contained within it, should not be used to score or rank states.
      Moreover, the component questions within a given policy, although they
      are represented together graphically, are not additive."

      This pipeline does both of the things that sentence rules out. It averages
      the Yes/No/Partial answers across component questions into spot_score
      (07_process_data.R ~1254-1261), which is additive aggregation, and
      spot_score then feeds policy_intent and the composite Electro-Industrial
      Index, whose outputs rank states.

      The page also says all the information is derived from the public domain,
      so the underlying facts are probably usable -- but the publisher's stated
      restriction is on the aggregation and ranking, which is precisely what the
      index does with it.

      Note that the aggregation predates this repository: the upstream
      Policy.R computes spot_score identically, so this was inherited rather
      than introduced here (see docs/legacy_parity.md section 3).

      If the position is ever revisited, the options are: seek written
      permission from SPOT; rebuild the indicator without cross-question
      averaging; or drop it from policy_intent, which would change sub-index
      composition and leave that sub-index with four variables.

      Also unresolved: the committed workbook is "50 State Gap Analysis.xlsx",
      one worksheet per state, which is not obviously a SPOT export. Whether it
      came from SPOT at all, or from an intermediary who had already done the
      aggregation, still needs confirming. See docs/data_audit.md A-1.

