    access_class: file_url
    endpoint: "https://transition.fcc.gov/bureaus/oet/info/maps/areas/data/FCC_PEA_website.xlsx"
    auth_env: null
    geography: PEA
    cadence: static
    typical_release_lag_days: null
    refresh_cron: null
    staleness:
      warn_after_days: 730
      fail_after_days: 1095
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      Sheet 3 (t_FCC_PEA_Counties) holds 3,236 county rows covering all 416
      PEAs; FIPS is 5-character text joining to the Census paste0(STATE,
      COUNTY) key. Verified byte-identical to the FCC original, sha256
      a1f177239b1adcc793f79e30099d41437290a22fd7c5cd788e708f7626761e94.

  # -- Public, but redistribution terms unverified -------------------------

  - id: clean_investment_monitor
    label: "Clean Investment Monitor quarterly investment and facility data"
    feeds:
      - clean_tech_investment
      - battery_manufacturing
      - solar_manufacturing
      - ev_manufacturing
    publisher: "Rhodium Group / MIT CEEPR"
    access_class: manual
    endpoint: null
    auth_env: null
    geography: state
    cadence: quarterly
    typical_release_lag_days: 45
    refresh_cron: null
    staleness:
      warn_after_days: 150
      fail_after_days: 240
    steward: TODO
    # TODO-CONFIRM: no licence text ships with the CSVs and the repo is
    # MIT-licensed. Treated as non-redistributable until confirmed.
    can_commit_raw: false
    license: "TODO-CONFIRM"
    manual_instructions: >
      Download the quarterly release from cleaninvestmentmonitor.org. Three
      files are required: quarterly_actual_investment.csv,
      manufacturing_facility_metadata.csv and socioeconomics.csv. Each carries
      an embedded `version:` and `created:` line in its header rows -- use the
      `version:` value as the vintage_label, NOT the directory name.
    template: data/manual/clean_investment_monitor/TEMPLATE.csv
    column_contract:
      quarterly_actual_investment:
        [Segment, State, Technology, Subcategory, quarter,
         Estimated_Actual_Quarterly_Expenditure, Decarb_Sector]
    notes: >
      Classified `manual` despite being web-published because redistribution
      terms are unconfirmed; promote to file_url once they are. The committed
      directory is named q2_2025 but manufacturing_facility_metadata.csv is
      version 2025_Q4.20260109.0 -- two quarters newer than the other two files
      (F-09). The facility schema gate also requires two columns the current
      release does not have, so that path silently falls back.

  # -- Licensed: manual upload lane ----------------------------------------

