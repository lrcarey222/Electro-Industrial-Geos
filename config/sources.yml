      fail_after_days: 550
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      The code pins ?year=2024 and reads sheet 2 from row 3, which yields
      unnamed columns (x1, x2, ...) and then falls back to the last numeric
      column and names[1] for the state key -- see F-07. The parser needs a
      column contract before this source can be trusted, let alone automated.

