# ---------------------------------------------------------------------------
# Source registry for the Electro-Industrial Index.
#
# One entry per SOURCE, not per indicator: a source may feed several
# indicators, and several indicators may share a source. Every indicator in
# config/index_definition.yml must be claimed by exactly one source -- CI fails
# the build on an orphan (an indicator no source claims) or a double-claim.
# That check is what stops a new indicator entering the index with no
# provenance and no owner.
#
# Provenance for every entry is recorded in docs/data_audit.md, with the file
# and line where the URL, path, or filename was actually found. Nothing here is
# guessed: where the origin could not be determined from the code, the entry
# says `access_class: unknown` and carries a TODO-CONFIRM.
#
# `# TODO-CONFIRM:` marks a value that is a conservative default awaiting a
# human decision, not an established fact. Do not remove one without answering
# the question it states.
#
# Secrets: `auth_env` holds the NAME of an environment variable, never a value.
#
# Denominator-only sources (BEA SAGDP, CIM socioeconomics) declare `feeds: []`.
# They are required to build indicators but do not themselves own one, so
# claiming an indicator here would trip the double-claim check.
#
# Deliberately NOT registered: data/raw/egrid2023_data_metric_rev2.xlsx,
# data/raw/table_8.xlsx and data/raw/state_business_cycle_status.csv. All three
# are staged by ingest_legacy_sources() but read by nothing -- see
# docs/data_audit.md section 3. Registering dead data would put permanent noise
# in every freshness report. They are a Phase 5 cleanup decision.
# ---------------------------------------------------------------------------

# Staleness SLAs are set from `cadence` using these defaults. They are a
# PROPOSAL, not a policy: an SLA says how long the index may go on quoting a
# number before someone must answer for it, which is an editorial judgement.
#
#   cadence      warn_after_days  fail_after_days
#   monthly                   60              120
#   quarterly                150              240
#   annual                   400              550
#   irregular                550              730
#   static                   730             1095
#
# TODO-CONFIRM: these thresholds. Measured from `publisher_release_date`, most
# sources are already past `warn` today -- EIA-861M ends 2025-11, the EIG
# dynamism panel is 2022, AFDC registrations are 2023. That is the honest
# reading of how stale the index is, but expect the first run to be mostly red.

sources:

  # -- Public, automatable: endpoint verified in the code ------------------

  - id: eia_861m_sales_revenue
    label: "EIA-861M retail sales and revenue by state and sector"
    feeds: [electricity_price, industrial_electricity_price]
    publisher: "U.S. Energy Information Administration"
    access_class: api
    endpoint: "https://www.eia.gov/electricity/data/eia861m/xls/sales_revenue.xlsx"
    auth_env: null
    geography: state
    cadence: monthly
    typical_release_lag_days: 75
    refresh_cron: "0 9 5 * *"
    staleness:
      warn_after_days: 60
      fail_after_days: 120
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      Stable URL, no key. Sheet 1 repeats a four-column block per customer
      class; the INDUSTRIAL price is the third Cents/kWh block (spreadsheet
      column P), not the first. See docs/refactor_plan.md F-04 -- the current
      code reads the residential column.

  - id: eia_860m_generators
    label: "EIA-860M preliminary monthly generator inventory"
    feeds: [electric_capacity_growth, clean_electric_capacity_growth]
    publisher: "U.S. Energy Information Administration"
    access_class: api
    endpoint: "https://www.eia.gov/electricity/data/eia860m/xls/{month}_generator{year}.xlsx"
    auth_env: null
    geography: state
    cadence: monthly
    typical_release_lag_days: 60
    refresh_cron: "0 9 5 * *"
    staleness:
      warn_after_days: 60
      fail_after_days: 120
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      Filename is a predictable lowercase-month + year pattern, so the
      connector must discover the latest available month rather than assume
      one. 19 of the 21 workbooks currently staged under data/raw/remote are
      identical 66,904-byte HTML error pages saved with an .xlsx extension --
      see docs/refactor_plan.md F-12. Validate the PK signature on download.

  - id: bea_sqgdp
    label: "BEA quarterly GDP by state and industry"
    feeds: [gdp_growth_index]
    publisher: "U.S. Bureau of Economic Analysis"
    access_class: file_url
    endpoint: "https://apps.bea.gov/regional/zip/SQGDP.zip"
    auth_env: null
    geography: state
    cadence: quarterly
    typical_release_lag_days: 90
    refresh_cron: "0 9 1 1,4,7,10 *"
    staleness:
      warn_after_days: 150
      fail_after_days: 240
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      Read by the pipeline but absent from the download registry, so it has
      never been refreshed (F-06). The member filename embeds its vintage
      (SQGDP9__ALL_AREAS_2005_2025.csv) and is matched exactly, so the next
      release silently yields an empty table; match on the prefix instead.

  - id: bea_sagdp
