    cadence: annual
    typical_release_lag_days: 240
    refresh_cron: "0 9 1 * *"
    staleness:
      warn_after_days: 400
      fail_after_days: 550
    steward: TODO
    can_commit_raw: true
    license: "TODO-CONFIRM: LBNL publications are generally freely available; terms not verified."
    notes: >
      The URL embeds both the release month (2025-08) and a file version (_v2),
      so it changes every release and cannot be treated as stable. A connector
      needs a discovery step against the Queued Up landing page.

