    staleness:
      warn_after_days: 400
      fail_after_days: 550
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      Denominator only: supplies gdp_2024 for incentives_gdp, which is owned by
      gjf_subsidy_tracker. Same hard-coded-vintage-filename problem as SQGDP.

  - id: bls_qcew
