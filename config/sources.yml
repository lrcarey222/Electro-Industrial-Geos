    refresh_cron: null
    staleness:
      warn_after_days: 150
      fail_after_days: 240
    steward: TODO
    can_commit_raw: false
    license: "Commercial subscription -- redistribution prohibited"
    manual_instructions: >
      Requires a BloombergNEF subscription. Export the Global Data Center Live
      IT Capacity Database, sheet "Data Centers". Save to the path named in the
      data-refresh issue; do NOT commit it. Set EIG_MANUAL_DIR to a local
      directory outside the repository, or use the configured object store.
    template: data/manual/bnef_datacenter_capacity/TEMPLATE.csv
    column_contract:
      data_centers:
        [Company, Facility Category, "Headline Capacity (MW)",
         "Under Construction Capacity (MW)", "Committed Capacity (MW)",
         Latitude, Longitude, Date]
    notes: >
      A 37.7 MB copy is currently committed to this public repository -- see
      F-13, unresolved. The code hard-filters Date == "2025-03-31", so a newer
      export yields zero rows silently (F-08); select the latest available Date
      instead and record it as the vintage.

