    staleness:
      warn_after_days: 150
      fail_after_days: 240
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      Open data, no key. The existing implementation issues ~3,100 requests per
      quarter pulled, twice, via blsAPI::blsQCEW(); a connector should use the
      bulk single-file endpoint instead. blsAPI was archived from CRAN in 2021
      (F-16). Both indicators currently hold sample data only (F-05).

