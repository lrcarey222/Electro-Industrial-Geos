    staleness:
      warn_after_days: 550
      fail_after_days: 730
    steward: TODO
    # TODO-CONFIRM: EIG is a non-profit, not a government body. Redistribution
    # terms for the downloadable workbook have not been checked.
    can_commit_raw: false
    license: "TODO-CONFIRM"
    notes: >
      The committed workbook's panel ends at 2022 and the code filters to
      max(year), so the indicator is a 2022 vintage regardless of when the file
      was fetched. Both the asset path and the filename carry years.

