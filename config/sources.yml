  - id: bls_qcew
    label: "BLS Quarterly Census of Employment and Wages, county level"
    feeds: [workforce_share, workforce_growth]
    publisher: "U.S. Bureau of Labor Statistics"
    access_class: api
    endpoint: "https://data.bls.gov/cew/data/api/{year}/{quarter}/industry/{industry_code}.csv"
    auth_env: null
    geography: state
    cadence: quarterly
    typical_release_lag_days: 150
    refresh_cron: "0 9 15 3,6,9,12 *"
    staleness:
      warn_after_days: 150
      fail_after_days: 240
    steward: jonekberg
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      Open data, no key, no registration. Endpoint verified 2026-09-17; latest
      available period is 2026 Q1. An industry slice carries every geography for
      that NAICS code -- national, state, MSA and county -- so ~39 requests
      totalling ~1.5 MB replace the current design's ~6,200 requests and ~440 MB
      of county files.

      `geography` is recorded as `state`, not `county-rolled-up`, which is a
      change from the existing implementation and the point of the redesign:
      rolling up county data recovers only about 45% of the employment the same
      industry reports at state level, because QCEW suppresses small cells and
      suppression rises steeply as geography narrows.

      CRITICAL: suppressed cells arrive as 0, not NA (disclosure_code == "N"),
      and the current code sums with na.rm = TRUE -- so withheld reads as none.
      For NAICS 334210 in 2024, 272 of 313 rows are suppressed and all 272
      report 0 employment.

      Two of the bundle's 6-digit codes, 335911 and 335912 (battery
      manufacturing), return 404 at 6-digit detail, so a connector must tolerate
      an absent slice rather than treating it as a failure.

      Neither indicator has ever been computed from real data: the guard tests
      requireNamespace("blsQCEW"), and no such package exists in this repo or the
      upstream. blsAPI, which does provide blsQCEW(), was archived from CRAN in
      2021 (F-16). Both indicators currently hold sample data only (F-05).

      Decisions taken 2026-09-17: suppressed cells are treated as NA, and the
      bundle is read at 4-digit depth (19% state-level suppression across the
      published bundle codes, against 84% at county level).

      OUTSTANDING: 9 of the bundle's 10 telecom/broadcasting codes return 404 in
      QCEW, as do 4 of their 5 four-digit parents, so the broad bundle's telecom
      third currently matches no published series. QCEW does publish 517111,
      517112, 517121, 516 and 5161, so the industries exist under different
      codes and the bundle appears to mix NAICS vintages. Remapping is a
      methodology change and needs a human decision.

      PEA-level workforce is not achievable from QCEW: 181 of 410 PEAs would
      have no disclosed bundle employment at all and the median PEA is 94%
      suppressed. PEAs currently inherit their state's value by join, so the
      county roll-up can be dropped without loss.

      Full measurements, options and the outstanding decisions:
      docs/bls_qcew_options.md

