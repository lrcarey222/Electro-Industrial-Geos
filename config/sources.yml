    staleness:
      warn_after_days: 400
      fail_after_days: 550
    steward: TODO
    can_commit_raw: true
    license: "Public domain (US Government work)"
    notes: >
      The URL carries a dated filename AND a cache-busting query token
      (?12518e7893), both of which change per release. The committed file is the
