# ---------------------------------------------------------------------------
# Steward map -- who answers for each source when it goes stale.
#
# Read by the freshness notifier to assign data-refresh issues. `steward:` in
# config/sources.yml holds the github_handle directly; this file records who
# that is and what else they own. CI checks the two agree, so a source cannot
# be assigned to someone who is not listed here.
#
# github_handle values are public GitHub usernames. Email is deliberately null:
# handles are enough to assign an issue, and the notifier never prints contact
# details into a public issue body. See config/stewards.example.yml for the
# full schema.
# ---------------------------------------------------------------------------

stewards:
